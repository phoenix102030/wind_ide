experiment_type: VectorMIDE
seed: 234
device: cuda
allow_device_fallback: false

n_dim: 3
p_dim: 2
m_dim: 6
height_target: 140

img_size: 40
in_channels: 6
hidden_dim: 64
output_dim: 18
mu_scale_init: 10.0
component_mixing_floor: 0.01
network_type: cnn_transformer
transformer_d_model: 128
transformer_nhead: 4
transformer_layers: 2
transformer_dim_feedforward: 256
transformer_dropout: 0.1
transformer_causal: true
transformer_max_len: 4096

nwp_channel_names:
- u100
- v100
- u140
- v140
- u180
- v180
component_specific_mu: true
component_mean_mode: shared_residual
advection_mode: component
deformation_scale: 0.3
anchored_advection: true
advection_residual_scale: 1.0
component_residual_scale: 0.5
station_feature_pooling: true
advection_component_scale: [ 1.0, 1.0, 1.0, 1.0 ]
covariance_mode: coupled_block_cholesky
covariance_regimes: 3
covariance_regime_stds: [ 0.3, 1.0, 3.0 ]
covariance_floor: 0.02
covariance_dynamic_scale: false
covariance_scale_init: 1.0
covariance_scale_min: 0.25
covariance_scale_max: 4.0
covariance_cross_corr_limit: 0.5

dt: 1.0
dt_seconds: 600.0
time_mode: target_only
gamma: 0.0
learnable_gamma: false

row_normalize: true
use_spectral_scaling: false
spectral_radius: 0.98
kernel_jitter: 1e-5
kalman_jitter: 1e-5
ell_init: 4.0
ell_min: 2.0
ell_max: 12.0
learnable_ell: false
sigma_scale_init: 10.0
sigma_scale_min: 10.0
sigma_scale_max: 10.0
learnable_sigma_scale: false

q_init: 0.15
r_init: 0.15
bounded_qr: true
q_std_min: 0.03
q_std_max: 0.30
r_std_min: 0.03
r_std_max: 0.30
q_corr_limit: 0.6
r_corr_limit: 0.6

window_size: 336
rolling_window_size: 24
batch_size: 512
steps_per_epoch: 30
forecast_horizon: 36
transition_kernel_weight: false
transition_kernel_weight_init: 0.2
transition_kernel_weight_min: 0.0
transition_kernel_weight_max: 1.0
transition_residual_decay: false
transition_residual_decay_init: 0.97
transition_residual_decay_min: 0.0
transition_residual_decay_max: 1.0
transition_control: false
transition_control_scale: 0.5

lr_cnn: 2e-5
lr_heads: 1e-4
lr_kernel: 5e-4
lr_qr: 5e-4
weight_decay: 1e-4
grad_clip: 1.0

lambda_adv: 0.1
advection_supervision_mode: residual_mse
lambda_deform: 0.0
lambda_advection_residual: 0.001
adv_lambda_advection_residual: 0.01
lambda_smooth: 0.001
lambda_reg: 0.0001
lambda_multistep: 0.2
lambda_sigma_ratio: 0.0
sigma_ratio_min: 0.05
sigma_ratio_max: 0.5
lambda_covariance_proxy: 0.02
lambda_covariance_correlation: 0.0
lambda_regime_usage: 0.0
lambda_covariance_residual_nll: 0.0
lambda_covariance_shape: 0.5
covariance_residual_scale: 5.0
covariance_shape_floor: 0.05
covariance_proxy_floor: 0.05
lambda_calibration: 0.0001
covariance_proxy_mode: nwp_vs_pattern
covariance_proxy_primary: V_nwp_star
covariance_proxy_secondary: V_pattern_star
multistep_horizons: [ 1, 2, 3, 6, 9, 12, 18, 24, 36 ]
multistep_max_origins: 256
multistep_stages: [ joint, online ]
hybrid_first_horizon_direct: true
hybrid_direct_horizon_steps: 6
lambda_anchor: 0.01

offline_epochs_pretrain_adv: 1
offline_epochs_kf: 1
offline_epochs_finetune: 250

online_window_size: 168
online_update_every: 6
online_steps: 10
fast_online_scope: qr
fast_online_window_size: 1008
fast_online_stride: 36
fast_online_forecast_horizon: 12
fast_online_steps: 10
fast_online_lr: 5e-4
fast_online_lambda_multistep: 0.0
fast_online_print_every: 10
fast_online_checkpoint_name: vector_mide_fast_online_last.pt
online_validation_window_size: 168
online_validation_every_updates: 10
online_validation_forecast_horizon: 72
online_validation_gap: 0
online_checkpoint_metric: val_forecast_rmse_mean
online_early_stop_patience: 0
online_min_delta: 0.0
online_checkpoint_every_updates: 0
online_adaptation_scope: output_head
online_update_ell: false
online_lr: 5e-5
online_lambda_adv: 0.0
online_lambda_deform: 0.0
online_lambda_multistep: 0.1
online_multistep_horizons: [ 1, 3, 6, 12, 24, 36 ]
online_require_improvement_over_initial: true
online_global_steps: 1000
global_online_checkpoint_name: vector_mide_online_cuda_global.pt
initial_global_online_checkpoint_name: vector_mide_online_cuda_global_initial.pt
last_global_online_checkpoint_name: vector_mide_online_cuda_global_last.pt

checkpoint_dir: outputs/A1_sigma_bkup
offline_checkpoint_name: vector_mide_offline_cuda.pt
last_offline_checkpoint_name: vector_mide_offline_cuda_last.pt
offline_checkpoint_every_epochs: 25
offline_checkpoint_keep: 12
online_checkpoint_name: vector_mide_online_cuda.pt
last_online_checkpoint_name: vector_mide_online_cuda_last.pt
checkpoint_stage: joint
checkpoint_metric: val_loss_forecast

validation_enabled: true
validation_fraction: 0.15
validation_window_size: null
validation_num_windows: 8
validation_min_windows: 2
validation_every_epochs: 5

data:
  offline_measurement_path: data/measurement/wv_h100_180_offline_imputed.mat
  offline_nwp_path: data/nwp/data_grid_offline.mat
  online_measurement_path: data/measurement/wv_h100_180_online_imputed.mat
  online_nwp_path: data/nwp/data_grid_online.mat
  target_mode: residual_nwp
  prefer_imputed_measurements: true
  measurement_missing_policy: error
  require_complete_target: true
  use_measurement_station_coords: true
  station_grid_indices:
  - [ 18, 18 ]
  - [ 20, 20 ]
  - [ 22, 22 ]
  advection_anchor_mode: nwp
  advection_label_mode: pattern_tracking
  advection_nwp_weight: 0.75
  advection_anchor_nwp_weight: 0.5
  advection_pattern_weight: 0.75
  optical_flow_label_scale: 1.0
  station_optical_flow_patch_radius: 2
  station_optical_flow_stride: 1
  station_optical_flow_ridge: 0.001
  station_optical_flow_max_displacement_km: 20.0
  pattern_tracking_patch_radius: 6
  pattern_tracking_max_shift_cells: 4
  deformation_label_mode: none
  deformation_label_clip: 0.3
  optical_flow_stride: 2
  optical_flow_ridge: 1e-4
  patch_radius: 2
  standardize_x: true
  standardize_z: false
